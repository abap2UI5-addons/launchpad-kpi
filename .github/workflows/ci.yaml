name: ci

# The checks of this repository, from the shared CI template of
# abap2UI5-addons (rap-ext, .github/ci/README.md):
#
#   abaplint      Standard ABAP (abaplint.jsonc)
#   abap2ui5lint  the released-API check of the abap2UI5-linter
#                 (abap2ui5lint.jsonc, allClasses) - without the render gate,
#                 this repository builds no view
#
# The default branch is `standard`, not main. No ABAP Cloud lint: Gateway
# (/IWBEP/) does not exist on ABAP Cloud (AGENTS.md, CI). No ABAP Unit tests
# and no namespace rename (abaplint cannot rename the Gateway objects). The
# core is resolved from its main branch with no version pin: the weekly run
# notices an upstream rename while no pull request is open.

on:
  push:
    branches: [standard]
  pull_request:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # the template's publish-badges asks for contents: write, and GitHub
    # refuses a run whose called job asks for more than the caller grants. It
    # never runs here (no badges in abap2ui5lint.jsonc); every job that runs
    # the code keeps a read-only token
    permissions:
      contents: write
    uses: abap2UI5-addons/rap-ext/.github/workflows/addon-check.yaml@d599eb227a476d120b473ae3b707fe983ab3e441 # ci-v1.1.0
    with:
      abaplint: '["./abaplint.jsonc"]'
      abap2ui5lint-render: false
      canary: ${{ github.event_name == 'schedule' }}
      # the default branch here - where the badges would be published from
      branch: standard
